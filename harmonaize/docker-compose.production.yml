volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  
  production_redis_data: {}
  production_armadillo_postgres_data: {}
  


services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: harmonaize_production_django
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    environment:
      ANALYSIS_EXPORT_DATABASE_URL: ${ANALYSIS_EXPORT_DATABASE_URL:-postgres://debug:debug@armadillo_postgres:5432/armadillo_snapshot}
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: harmonaize_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: harmonaize_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '0.0.0.0:5555:5555'

  redis:
    image: docker.io/redis:6
    
    volumes:
      - production_redis_data:/data
    

  celeryworker:
    <<: *django
    image: harmonaize_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: harmonaize_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: harmonaize_production_flower
    command: /start-flower

  armadillo_postgres:
    image: postgres:16
    profiles: ["analysis"]
    environment:
      POSTGRES_DB: armadillo_snapshot
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: debug
    volumes:
      - production_armadillo_postgres_data:/var/lib/postgresql/data

  armadillo:
    image: molgenis/molgenis-armadillo-snapshot:latest
    profiles: ["analysis"]
    depends_on:
      - armadillo_postgres
    environment:
      SPRING_SECURITY_USER_PASSWORD: ${ARMADILLO_ADMIN_PASSWORD:-admin}
      LOGGING_CONFIG: classpath:logback-file.xml
      AUDIT_LOG_PATH: /app/logs/audit.log
