volumes:
  harmonaize_local_postgres_data: {}
  harmonaize_local_postgres_data_backups: {}
  harmonaize_local_redis_data: {}
  harmonaize_local_armadillo_data: {}
  harmonaize_local_armadillo_logs: {}

networks:
  armadillo-net:
    driver: bridge

services:
  # Runs once before the app starts. On a fresh clone it creates
  # .envs/.local/.django with random secrets; afterwards it does nothing.
  setup:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: harmonaize_local_django
    container_name: harmonaize_local_setup
    volumes:
      - .:/app:z
    entrypoint: ["python", "scripts/init_envs.py"]
    restart: "no"

  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: harmonaize_local_django
    container_name: harmonaize_local_django
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - .:/app:z
    env_file:
      # Created by the setup service on first start.
      - path: ./.envs/.local/.django
        required: false
      - ./.envs/.local/.postgres
    environment:
      # Read by the entrypoint, so the first start already uses the new file.
      AUTOLOAD_ENV_FILE: /app/.envs/.local/.django
      ANALYSIS_DEIDENTIFICATION_SALT: harmonaize-local-analysis-salt
      ANALYSIS_EXPORT_ROOT: /app/harmonaize/media/analysis_exports
      ANALYSIS_ARMADILLO_BASE_URL: http://armadillo:8080
      ANALYSIS_ARMADILLO_USERNAME: admin
      ANALYSIS_ARMADILLO_PASSWORD: admin
      ANALYSIS_KEYCLOAK_SYNC_ENABLED: "true"
      ANALYSIS_KEYCLOAK_BASE_URL: http://keycloak:8080
      ANALYSIS_KEYCLOAK_REALM: Armadillo
      ANALYSIS_KEYCLOAK_ADMIN_USERNAME: admin
      ANALYSIS_KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - default
      - armadillo-net
    ports:
      - '8000:8000'
    command:
      - /start
      - --reload-exclude
      - vendor/**
      - --reload-exclude
      - harmonaize/media/**

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: harmonaize_production_postgres
    container_name: harmonaize_local_postgres
    volumes:
      - harmonaize_local_postgres_data:/var/lib/postgresql/data
      - harmonaize_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    ports:
      # Local only: the local database credentials are not secret.
      - '127.0.0.1:5432:5432'

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: harmonaize_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: harmonaize_local_redis
    
    volumes:
      - harmonaize_local_redis_data:/data
    

  celeryworker:
    <<: *django
    image: harmonaize_local_celeryworker
    container_name: harmonaize_local_celeryworker
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailpit:
        condition: service_started
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: harmonaize_local_celerybeat
    container_name: harmonaize_local_celerybeat
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailpit:
        condition: service_started
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: harmonaize_local_flower
    container_name: harmonaize_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  armadillo:
    image: molgenis/molgenis-armadillo:latest
    profiles: ["analysis"]
    environment:
      LOGGING_CONFIG: 'classpath:logback-file.xml'
      AUDIT_LOG_PATH: '/app/logs/audit.log'
      SPRING_SECURITY_USER_PASSWORD: 'admin'
      SPRING_RSERVER_URL: 'http://rserver:6311'
      DEBUG: "TRUE"
    ports:
      - "${ARMADILLO_HOST_PORT:-8001}:8080"
    volumes:
      # Keep mutable Armadillo storage out of the macOS repository bind mount.
      # Docker Desktop file sharing can return EDEADLK after host sleep/long idle.
      - harmonaize_local_armadillo_logs:/app/logs
      - harmonaize_local_armadillo_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vendor/molgenis-service-armadillo/docker/quickstart/config:/config:ro
    networks:
      - armadillo-net
    depends_on:
      keycloak:
        condition: service_healthy

  rserver:
    image: datashield/rock-base:latest
    profiles: ["analysis"]
    environment:
      DEBUG: "TRUE"
      ROCK_ADMINISTRATOR_NAME: "administrator"
      ROCK_ADMINISTRATOR_PASSWORD: "password"
      ROCK_MANAGER_NAME: "manager"
      ROCK_MANAGER_PASSWORD: "manager"
      ROCK_USER_NAME: "user"
      ROCK_USER_PASSWORD: "user"
    ports:
      - "${ARMADILLO_RSERVER_HOST_PORT:-6311}:6311"
    networks:
      - armadillo-net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    profiles: ["analysis"]
    command:
      - start-dev
      - "--features=scripts"
      - "--health-enabled=true"
      - "--http-management-port=9000"
      - "--hostname=keycloak"
      - "--hostname-strict=false"
      - "--import-realm"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${ARMADILLO_KEYCLOAK_HOST_PORT:-8080}:8080"
      - "${ARMADILLO_KEYCLOAK_MANAGEMENT_HOST_PORT:-9001}:9000"
    volumes:
      - ./vendor/molgenis-service-armadillo/docker/quickstart/keycloak/realms:/opt/keycloak/data/import
    networks:
      - armadillo-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
