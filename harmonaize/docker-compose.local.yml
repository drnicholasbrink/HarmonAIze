include:
  - vendor/molgenis-service-armadillo/docker/quickstart/docker-compose.yml

volumes:
  harmonaize_local_postgres_data: {}
  harmonaize_local_postgres_data_backups: {}
  harmonaize_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: harmonaize_local_django
    container_name: harmonaize_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment:
      ANALYSIS_DEIDENTIFICATION_SALT: harmonaize-local-analysis-salt
      ANALYSIS_EXPORT_ROOT: /app/harmonaize/media/analysis_exports
      ANALYSIS_ARMADILLO_BASE_URL: http://armadillo:8080
      ANALYSIS_ARMADILLO_USERNAME: admin
      ANALYSIS_ARMADILLO_PASSWORD: admin
      ANALYSIS_KEYCLOAK_SYNC_ENABLED: "true"
      ANALYSIS_KEYCLOAK_BASE_URL: http://keycloak:8080
      ANALYSIS_KEYCLOAK_REALM: Armadillo
      ANALYSIS_KEYCLOAK_ADMIN_USERNAME: admin
      ANALYSIS_KEYCLOAK_ADMIN_PASSWORD: admin

    networks:
      - default
      - armadillo-net
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: harmonaize_production_postgres
    container_name: harmonaize_local_postgres
    volumes:
      - harmonaize_local_postgres_data:/var/lib/postgresql/data
      - harmonaize_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    ports:
      - '5432:5432'

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: harmonaize_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: harmonaize_local_redis
    
    volumes:
      - harmonaize_local_redis_data:/data
    

  celeryworker:
    <<: *django
    image: harmonaize_local_celeryworker
    container_name: harmonaize_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: harmonaize_local_celerybeat
    container_name: harmonaize_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: harmonaize_local_flower
    container_name: harmonaize_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
